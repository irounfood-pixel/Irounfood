<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이로운과자점 주문하기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#315c4a;--bg:#f6f8f6;--text:#26332d;--muted:#718078;--line:#dfe6e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:24px 16px 50px}.head{padding:18px 0 22px}.brand{font-weight:900;font-size:25px;color:var(--p)}.sub{color:var(--muted);font-size:13px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;color:#68736d;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d2ddd5;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:100px}.product{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.price{font-weight:900;color:var(--p);margin-top:5px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:38px;height:38px;border:0;border-radius:9px;background:#edf3ee;color:var(--p);font-size:20px;font-weight:900}.qty input{width:60px;text-align:center;padding:9px;border:1px solid var(--line);border-radius:9px}.btn{width:100%;border:0;border-radius:10px;padding:13px;font-weight:900;font:inherit;cursor:pointer}.primary{background:var(--p);color:#fff}.sum{display:flex;justify-content:space-between;font-weight:900;font-size:17px;margin-top:14px}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="head"><div class="brand">이로운과자점</div><div class="sub">교육키트 · 반죽류 주문신청</div></div><div class="panel"><h2 style="margin-top:0">상품 선택</h2><div id="products"></div></div><div class="panel"><h2 style="margin-top:0">주문자 정보</h2><div class="grid"><div class="field"><label>이름 / 기관명 *</label><input id="name"></div><div class="field"><label>연락처 *</label><input id="contact" type="tel"></div><div class="field"><label>배송일 *</label><input id="ship" type="date"></div><div class="field"><label>수령방법</label><select id="method"><option>택배</option><option>방문수령</option></select></div><div class="field" style="grid-column:1/-1"><label>배송지 *</label><input id="address"></div><div class="field" style="grid-column:1/-1"><label>요청사항</label><textarea id="note"></textarea></div></div><div class="sum"><span>주문금액</span><span id="total">0원</span></div><button id="submitBtn" class="btn primary" style="margin-top:16px" onclick="submitOrder()">주문 신청하기</button></div></div>
<script>
const SUPABASE_URL='https://bgswafqssdmktnmyyqef.supabase.co';const SUPABASE_KEY='sb_publishable_T3tT8KOmwNjkqFdbkNzHbg_WEZ9WdzB';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let products=[];let cart={};let submitting=false;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
async function load(){const {data,error}=await db.from('products').select('*').eq('active',true).order('name');if(error){$('products').innerHTML='<div class="empty">상품 정보를 불러오지 못했습니다.</div>';return}products=data||[];render()}
function render(){if(!products.length){$('products').innerHTML='<div class="empty">현재 주문 가능한 상품이 없습니다.</div>';return}$('products').innerHTML=products.map(p=>{const q=cart[p.id]||0;return `<div class="product"><div><b>${esc(p.name)}</b><div class="price">${Number(p.price||0).toLocaleString('ko-KR')}원 / ${esc(p.sale_unit||'개')}</div><div style="color:#718078;font-size:12px;margin-top:4px">${esc(p.description||'')}</div></div><div class="qty"><button onclick="setQty('${p.id}',${Math.max(0,q-1)})">−</button><input type="number" min="0" value="${q}" step="1" onchange="setQty('${p.id}',Math.max(0,Math.floor(Number(this.value||0))))"><button onclick="setQty('${p.id}',${q+1})">+</button></div></div>`}).join('');updateTotal()}
function setQty(id,q){q=Math.floor(Number(q)||0);if(q<=0)delete cart[id];else cart[id]=q;render()}
function updateTotal(){const t=products.reduce((s,p)=>s+(Number(p.price||0)*(cart[p.id]||0)),0);$('total').textContent=t.toLocaleString('ko-KR')+'원'}
async function submitOrder(){if(submitting)return;const btn=$('submitBtn');const lines=products.filter(p=>Number.isInteger(cart[p.id])&&cart[p.id]>0).map(p=>({product_id:p.id,product_name_snapshot:p.name,quantity:cart[p.id],unit_price_snapshot:Number(p.price||0),inventory_item_id_snapshot:p.inventory_item_id||null,inventory_deduction_snapshot:Number(p.deduction_qty??1)}));if(!lines.length)return alert('상품을 하나 이상 선택해주세요.');if(!$('name').value.trim()||!$('contact').value.trim()||!$('ship').value||!$('address').value.trim())return alert('필수 정보를 입력해주세요.');submitting=true;btn.disabled=true;btn.textContent='신청 처리 중…';try{const {data:r,error:re}=await db.rpc('submit_customer_order_v2',{p_customer_name:$('name').value.trim(),p_contact:$('contact').value.trim(),p_ship_date:$('ship').value,p_address:$('address').value.trim(),p_receive_method:$('method').value,p_note:$('note').value.trim(),p_items:lines.map(x=>({product_id:x.product_id,quantity:x.quantity}))});if(re)throw re;alert('주문 신청이 접수되었습니다. 관리자 확인 후 주문이 확정됩니다.');cart={};$('name').value='';$('contact').value='';$('ship').value='';$('address').value='';$('note').value='';render()}catch(e){alert('주문 신청 처리 결과를 확인해주세요. '+(e.message||e))}finally{submitting=false;btn.disabled=false;btn.textContent='주문 신청하기'}}
load();
</script></body></html>
