<style>
:root{--p:#315c4a;--p2:#477762;--bg:#f4f7f4;--card:#fff;--text:#223028;--muted:#6c7771;--line:#dfe7e1;--danger:#b9423e;--warn:#9a6a00;--shadow:0 8px 24px rgba(32,55,44,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.layout{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;z-index:20}.logo{font-weight:900;font-size:20px;color:var(--p);padding:8px 10px 18px}.logo small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:5px}.nav button{display:block;width:100%;border:0;background:transparent;color:#55625b;text-align:left;padding:12px;border-radius:10px;margin:3px 0;font-weight:700}.nav button.active,.nav button:hover{background:#edf4ef;color:var(--p)}.side .foot{position:absolute;left:14px;right:14px;bottom:18px;color:var(--muted);font-size:11px;padding:10px}.main{margin-left:230px;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.top h1{font-size:26px;margin:0}.btn{border:0;border-radius:10px;padding:11px 15px;min-height:42px;font-weight:800}.primary{background:var(--p);color:#fff}.secondary{background:#edf2ee;color:var(--p)}.danger{background:#fae9e8;color:var(--danger)}.light{background:#fff;color:#455249;border:1px solid var(--line)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .num{font-size:28px;font-weight:900;margin-top:6px}.panel{padding:18px;margin-top:15px}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:800;color:#68736d;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d2ddd5;border-radius:9px;background:#fff;padding:11px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;min-height:42px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}.table th{background:#f7faf7;color:#67736c;white-space:nowrap}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef3ef;color:#52615a}.badge.warn{background:#fff4d9;color:var(--warn)}.badge.danger{background:#fce9e8;color:var(--danger)}.badge.good{background:#e9f5ee;color:#236544}.kitrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 42px;gap:8px;align-items:end;margin-bottom:9px}.mini{font-size:11px;color:var(--muted)}.product-card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:9px}.modal{position:fixed;inset:0;background:rgba(19,28,23,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.toast{position:fixed;right:20px;bottom:20px;background:#26352e;color:#fff;padding:12px 15px;border-radius:10px;z-index:80;box-shadow:var(--shadow)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{margin:0;color:var(--p);font-size:25px}.loginbox p{color:var(--muted);font-size:13px}.empty{padding:32px 12px;text-align:center;color:var(--muted)}.qty{font-weight:900}.right{text-align:right}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:110px;padding:9px}.day .n{font-weight:900}.day .count{font-size:11px;color:var(--p);margin-top:6px}.day.mutedday{background:#fafcfa;color:#a1aaa4}.dangertext{color:var(--danger);font-weight:800}.green{color:var(--p);font-weight:800}@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.formgrid3{grid-template-columns:1fr 1fr}}@media(max-width:760px){.side{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.side .foot{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap}.main{margin-left:0;padding:16px}.top h1{font-size:21px}.grid4,.grid3,.formgrid,.formgrid3{grid-template-columns:1fr}.table{min-width:700px}.kitrow{grid-template-columns:1fr 105px 40px}.calendar{gap:4px}.day{min-height:88px;padding:6px}}
</style>

<body><div role="status" style="position:sticky;top:0;z-index:1000;padding:10px 14px;background:#e8f4ee;color:#24563b;border-bottom:1px solid #c7e4d2;text-align:center;font:700 13px/1.45 system-ui,-apple-system,sans-serif">운영 시스템입니다. 출고 처리 전 실제 재고 수량을 확인하세요.</div>
<div id="login" class="login">
  <div class="loginbox">
    <h1>이로운과자점 주문관리</h1>
    <p>Supabase 관리자 계정으로 로그인합니다.</p>
    <div class="field"><label>이메일</label><input id="email" type="email" autocomplete="username" placeholder="관리자 이메일"></div>
    <div class="field" style="margin-top:10px"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">로그인</button>
    <div class="muted" style="margin-top:12px">로그인 정보는 Supabase Auth에서 확인합니다.</div>
  </div>
</div>
<div id="app" class="layout hidden">
  <aside class="side"><div class="logo">이로운과자점<small>주문 · 상품 · 재고 관리</small></div><div class="nav" id="nav"></div><div class="foot"><button class="btn light" style="width:100%" onclick="logout()">로그아웃</button></div></aside>
  <main class="main"><div id="page"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://iqopdxrnkmpdivzndkxq.supabase.co';
const SUPABASE_KEY='sb_publishable_8jMegFjVcyhp1SIRZHosAQ_fVoxo8Nr';
const {createClient}=supabase; const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let state={page:'dashboard',orders:[],products:[],items:[],requests:[],movements:[],loading:false,errors:[]};
const menus=[['dashboard','대시보드'],['order','주문등록'],['orders','주문현황'],['orderprocess','주문처리'],['shipped','출고완료'],['requests','고객주문'],['calendar','발송캘린더'],['prep','월별 준비량'],['products','상품관리'],['inventory','재고관리'],['settings','설정']];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
async function login(){
 const email=$('email').value.trim();
 const password=$('pw').value;
 if(!email||!password)return toast('이메일과 비밀번호를 입력해주세요.');
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error)return toast('로그인 실패: '+(error.message||error));
 await showApp();
}
async function logout(){await db.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pw').value='';}
async function showApp(){const {data}=await db.auth.getSession();if(!data.session){$('app').classList.add('hidden');$('login').classList.remove('hidden');return;}$('login').classList.add('hidden');$('app').classList.remove('hidden');renderNav();await init();}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('pw').focus()});
db.auth.onAuthStateChange((_event,session)=>{if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');renderNav();if(!state.loading) init();}else{$('app').classList.add('hidden');$('login').classList.remove('hidden');}});
function renderNav(){$('nav').innerHTML=menus.map(([k,n])=>`<button class="${state.page===k?'active':''}" onclick="route('${k}')">${n}</button>`).join('')}
function route(p){state.page=p;renderNav();({dashboard:renderDashboard,order:renderOrderForm,orders:renderOrders,orderprocess:renderOrderProcessing,shipped:renderShippedOrders,requests:renderRequests,calendar:renderCalendar,prep:renderMonthlyPrep,products:renderProducts,inventory:renderInventory,settings:renderSettings}[p]||renderDashboard)()}
async function readTable(label,queryFactory){
 try{const {data,error}=await queryFactory();if(error){const message=label+': '+(error.message||'조회 오류');state.errors.push(message);console.error(message,error);return null;}return data||[];}
 catch(e){const message=label+': '+(e.message||e);state.errors.push(message);console.error(message,e);return null;}
}
async function loadAll(){state.loading=true;state.errors=[];try{
 const [os,pis,ii,cr,mv]=await Promise.all([
  readTable('주문',()=>db.from('orders').select('*,order_items(*)').order('ship_date',{ascending:true}).order('order_no',{ascending:true})),
  readTable('상품',()=>db.from('products').select('*').order('name')),
  readTable('재고품목',()=>db.from('inventory_items').select('*').order('name')),
  readTable('고객주문신청',()=>db.from('customer_order_requests').select('*,customer_order_request_items(*)').order('created_at',{ascending:false})),
  readTable('재고이력',()=>db.from('inventory_transactions').select('*').order('created_at',{ascending:false}).limit(200))
 ]);
 state.orders=os||[];state.products=pis||[];state.items=ii||[];state.requests=cr||[];state.movements=mv||[];
 if(state.errors.length)toast('일부 데이터 조회 실패: '+state.errors[0]);
 }catch(e){state.errors.push('초기화: '+(e.message||e));console.error(e);toast('데이터 조회 실패: '+(e.message||e));}finally{state.loading=false}}
let initPromise=null;async function init(){if(initPromise)return initPromise;initPromise=(async()=>{await loadAll();route(state.page)})();try{return await initPromise}finally{initPromise=null}}
function stat(label,num){return `<div class="stat"><div class="label">${label}</div><div class="num">${num}</div></div>`}
function activeProducts(){return state.products.filter(x=>x.active!==false)}
function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
function dateStr(d){return d?new Date(d).toLocaleDateString('ko-KR'):''}
function orderRows(){return state.orders.flatMap(o=>(o.order_items||[]).map(i=>({...i,order:o})))}
function renderDashboard(){
 const today=new Date().toISOString().slice(0,10); const tom=new Date(Date.now()+86400000).toISOString().slice(0,10);
 const todayCount=state.orders.filter(o=>o.ship_date===today&&o.order_status!=='취소').length; const tomCount=state.orders.filter(o=>o.ship_date===tom&&o.order_status!=='취소').length;
 const pending=state.orders.filter(o=>['주문접수','준비중'].includes(o.order_status||'주문접수')).length;
 const low=state.items.filter(i=>Number(i.current_qty)<0).length;
 $('page').innerHTML=`<div class="top"><div><h1>대시보드</h1><div class="muted">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div></div><button class="btn secondary" onclick="init()">새로고침</button></div>
 <div class="grid4">${stat('오늘 발송',todayCount+'건')}${stat('내일 발송',tomCount+'건')}${stat('대기 주문',pending+'건')}${stat('재고 품목',state.items.length+'개')}</div>
 <div class="grid3"><div class="panel"><div class="between"><h2 style="margin:0">오늘 발송</h2><button class="btn light" onclick="route('calendar')">캘린더</button></div>${shippingList(today)}</div>
 <div class="panel"><div class="between"><h2 style="margin:0">재고 주의</h2><button class="btn light" onclick="route('inventory')">재고관리</button></div>${inventoryWarnings()}</div>
 <div class="panel"><div class="between"><h2 style="margin:0">고객 주문신청</h2><button class="btn light" onclick="route('requests')">확인</button></div>${requestList()}</div></div>`
}
function shippingList(day){const a=state.orders.filter(o=>o.ship_date===day&&o.order_status!=='취소');if(!a.length)return '<div class="empty">오늘 발송 주문이 없습니다.</div>';return '<div>'+a.slice(0,8).map(o=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(o.order_no)}</b> · ${esc(o.customer_name||o.address||'')}</div>`).join('')+'</div>'}
function inventoryWarnings(){const a=state.items.filter(i=>Number(i.current_qty)<=0);if(!a.length)return '<div class="empty">현재 재고가 0 이하인 품목이 없습니다.</div>';return a.slice(0,8).map(i=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(i.name)}</b> <span class="dangertext">${fmt(i.current_qty)} ${esc(i.unit||'')}</span></div>`).join('')}
function requestList(){const a=state.requests.filter(x=>x.status==='신청').slice(0,7);if(!a.length)return '<div class="empty">대기 중인 고객 주문신청이 없습니다.</div>';return a.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.customer_name)}</b> · ${esc(x.contact||'')} <span class="badge warn">신청</span></div>`).join('')}
function productOptions(onlyActive=true){return (onlyActive?activeProducts():state.products).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
function itemOptions(){return state.items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)} (${fmt(i.current_qty)} ${esc(i.unit||'')})</option>`).join('')}
function renderOrderForm(){
 $('page').innerHTML=`<div class="top"><div><h1>주문등록</h1><div class="muted">기관 주문이나 관리자가 대신 접수하는 고객 주문을 등록합니다.</div></div></div>
 <div class="panel"><div class="formgrid3"><div class="field"><label>주문일</label><input id="o_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>기관/고객명 *</label><input id="o_customer" placeholder="예: ○○초등학교 / 홍길동"></div><div class="field"><label>담당자</label><input id="o_manager" placeholder="담당자"></div><div class="field"><label>연락처</label><input id="o_contact" placeholder="010-0000-0000"></div><div class="field"><label>배송일 *</label><input id="o_ship" type="date"></div><div class="field"><label>주문경로</label><select id="o_source"><option>기관주문</option><option>온라인주문</option><option>기타</option></select></div><div class="field"><label>배송지 *</label><input id="o_address" placeholder="주소"></div><div class="field"><label>수령방법</label><select id="o_method"><option>택배</option><option>방문수령</option></select></div><div class="field"><label>요청사항</label><input id="o_note" placeholder="요청사항"></div></div>
 <div style="margin-top:18px"><div class="between"><h2 style="margin:0">상품</h2><button class="btn secondary" onclick="addOrderLine()">+ 상품 추가</button></div><div id="olines"></div></div>
 <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="saveOrder()">주문 저장</button></div></div>`;
 addOrderLine();
}
function addOrderLine(){const w=$('olines');const d=document.createElement('div');d.className='kitrow';d.innerHTML=`<div class="field"><label>상품</label><select class="oline-product">${productOptions()}</select></div><div class="field"><label>수량</label><input class="oline-qty" type="number" min="1" value="1"></div><button class="btn danger" onclick="this.parentElement.remove()">×</button>`;w.appendChild(d)}
async function nextOrderNo(){const {data,error}=await db.rpc('next_order_no');if(error)throw error;return String(data)}
async function saveOrder(){
 const customer=$('o_customer').value.trim();
 const ship=$('o_ship').value;
 if(!customer||!ship||!$('o_address').value.trim())return toast('고객/기관명, 배송일, 배송지는 입력해주세요.');
 const lines=[...document.querySelectorAll('#olines .kitrow')].map(r=>({
   product_id:r.querySelector('.oline-product').value,
   quantity:Number(r.querySelector('.oline-qty').value||0)
 })).filter(x=>Number.isInteger(x.quantity)&&x.quantity>0);
 if(!lines.length)return toast('상품 수량은 1개 이상의 정수로 입력해주세요.');
 try{
   const {data,error}=await db.rpc('create_admin_order_v2',{
     p_order_date:$('o_date').value||null,
     p_customer_name:customer,
     p_manager_name:$('o_manager').value.trim()||null,
     p_contact:$('o_contact').value.trim()||null,
     p_ship_date:ship,
     p_order_source:$('o_source').value,
     p_address:$('o_address').value.trim(),
     p_receive_method:$('o_method').value,
     p_note:$('o_note').value.trim()||null,
     p_items:lines.map(x=>({product_id:x.product_id,quantity:x.quantity}))
   });
   if(error)throw error;
   if(!data)throw new Error('주문 생성 결과를 확인할 수 없습니다.');
   toast('주문이 저장되었습니다.');
   await init();
   route('orders');
 }catch(e){toast('저장 실패: '+(e.message||e))}
}
function renderOrders(){const q=(window.__orderq||'').toLowerCase();const selectedStatus=window.__orderStatus||'전체';const status=['전체','주문접수','준비중'].includes(selectedStatus)?selectedStatus:'전체';const rows=state.orders.filter(o=>o.order_status!=='취소'&&o.order_status!=='출고완료'&&(status==='전체'||(o.order_status||'주문접수')===status)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));$('page').innerHTML=`<div class="top"><div><h1>주문현황</h1><div class="muted">미출고 주문을 검색하고 엑셀로 다운로드할 수 있습니다. 출고완료 내역은 별도 메뉴에서 확인하세요.</div></div><div class="toolbar"><input placeholder="주문번호 / 고객명 / 상품 검색" value="${esc(window.__orderq||'')}" oninput="window.__orderq=this.value;renderOrders()"><select onchange="window.__orderStatus=this.value;renderOrders()"><option>전체</option><option>주문접수</option><option>준비중</option></select><button class="btn secondary" onclick="exportOrders()">엑셀 다운로드</button><button class="btn primary" onclick="route('order')">+ 주문등록</button></div></div>

 if(!p)return toast('삭제할 상품을 찾을 수 없습니다.');
 const ok=confirm(`상품 '${p.name}'을(를) 삭제할까요?\n\n과거 주문에 연결된 상품은 주문 기록 보존을 위해 삭제되지 않습니다. 그런 경우 판매중지로 변경해주세요.`);
 if(!ok)return;
 try{
   const {count,error:checkError}=await db.from('order_items').select('id',{count:'exact',head:true}).eq('product_id',id);
   if(checkError)throw checkError;
   if((count||0)>0){
     toast('이 상품은 기존 주문 내역에 연결되어 있어 삭제할 수 없습니다. 상품 수정에서 판매중지로 변경해주세요.');
     return;
   }
   const {error}=await db.from('products').delete().eq('id',id);
   if(error)throw error;
   toast('상품이 삭제되었습니다.');
   await init();
   route('products');
 }catch(e){
   toast('상품 삭제 실패: '+(e.message||e));
 }
}
async function saveProduct(id){const payload={name:$('p_name').value.trim(),category:$('p_cat').value.trim(),price:Number($('p_price').value||0),sale_unit:$('p_unit').value.trim()||'개',inventory_item_id:$('p_item').value||null,deduction_qty:Number($('p_dq').value||0),active:$('p_active').value==='true',description:$('p_desc').value.trim()};if(!payload.name)return toast('상품명을 입력해주세요.');try{let q=id?db.from('products').update(payload).eq('id',id):db.from('products').insert(payload);const {error}=await q;if(error)throw error;toast('상품이 저장되었습니다.');closeModal();await init();route('products')}catch(e){toast('상품 저장 실패: '+(e.message||e))}}
function openInventoryItem(id){const it=id?state.items.find(x=>x.id===id):null;openModal(`<div class="between"><h2 style="margin:0">${it?'재고품목 수정':'재고품목 추가'}</h2><button class="btn light" onclick="closeModal()">닫기</button></div><div class="formgrid" style="margin-top:16px"><div class="field"><label>품목명 *</label><input id="ii_name" value="${esc(it?.name||'')}"></div><div class="field"><label>구분</label><input id="ii_cat" value="${esc(it?.category||'')}" placeholder="예: 교육키트 / 원재료 / 부자재"></div><div class="field"><label>단위</label><input id="ii_unit" value="${esc(it?.unit||'개')}"></div><div class="field"><label>사용여부</label><select id="ii_active"><option value="true" ${it?.active!==false?'selected':''}>사용</option><option value="false" ${it?.active===false?'selected':''}>사용중지</option></select></div></div><div class="muted" style="margin-top:10px">현재재고는 재고거래로만 변경합니다.</div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="saveInventoryItem('${id||''}')">저장</button></div>`)}
async function saveInventoryItem(id){const payload={name:$('ii_name').value.trim(),category:$('ii_cat').value.trim(),unit:$('ii_unit').value.trim()||'개',active:$('ii_active').value==='true'};if(!payload.name)return toast('품목명을 입력해주세요.');try{const q=id?db.from('inventory_items').update(payload).eq('id',id):db.from('inventory_items').insert(payload);const {error}=await q;if(error)throw error;toast('재고품목이 저장되었습니다.');closeModal();await init();route('inventory')}catch(e){toast('재고품목 저장 실패: '+(e.message||e))}}
function renderInventory(){ $('page').innerHTML=`<div class="top"><div><h1>재고관리</h1><div class="muted">+ / - 버튼으로 재고를 조정하지만 실제 DB에는 거래이력이 남습니다.</div></div><div class="toolbar"><button class="btn secondary" onclick="openInventoryItem()">+ 재고품목 추가</button><button class="btn primary" onclick="openMovement()">+ 재고 추가/차감</button></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>품목</th><th>구분</th><th>현재재고</th><th>단위</th><th>관리</th></tr></thead><tbody>${state.items.length?state.items.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.category||'')}</td><td class="qty ${Number(i.current_qty)<0?'dangertext':''}">${fmt(i.current_qty)}</td><td>${esc(i.unit||'')}</td><td><button class="btn secondary" onclick="openMovement('${i.id}',1)">+ 추가</button> <button class="btn danger" onclick="openMovement('${i.id}',-1)">- 차감</button> <button class="btn light" onclick="openInventoryItem('${i.id}')">수정</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">재고품목이 없습니다.</div></td></tr>`}</tbody></table></div></div><div class="panel"><h2 style="margin:0">최근 재고이력</h2><div class="tablewrap"><table class="table"><thead><tr><th>일시</th><th>품목</th><th>수량</th><th>구분</th><th>사유</th></tr></thead><tbody>${state.movements.slice(0,50).map(m=>{const i=state.items.find(x=>x.id===m.inventory_item_id);return `<tr><td>${dateStr(m.created_at)}</td><td>${esc(i?.name||m.inventory_item_id)}</td><td class="${Number(m.delta)<0?'dangertext':'green'}">${Number(m.delta)>0?'+':''}${fmt(m.delta)}</td><td>${esc(m.tx_type||'')}</td><td>${esc(m.reason||'')}</td></tr>`}).join('')}</tbody></table></div></div>`}
function openMovement(itemId,sign){openModal(`<div class="between"><h2 style="margin:0">재고 ${sign===-1?'차감':'추가'}</h2><button class="btn light" onclick="closeModal()">닫기</button></div><div class="formgrid" style="margin-top:16px"><div class="field"><label>품목</label><select id="m_item">${itemOptions()}</select></div><div class="field"><label>수량</label><input id="m_qty" type="number" min="0.001" step="0.001" value="1"></div><div class="field"><label>구분</label><select id="m_type"><option>재고조정</option><option>구매입고</option><option>폐기</option><option>샘플사용</option><option>반품</option><option>기타</option></select></div><div class="field"><label>사유</label><input id="m_reason" placeholder="예: 실사차이 / 파손 / 구매입고"></div><div class="field"><label>LOT</label><input id="m_lot"></div><div class="field"><label>유통기한</label><input id="m_exp" type="date"></div></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="saveMovement(${sign===-1?-1:1})">저장</button></div>`);if(itemId)$('m_item').value=itemId}
async function saveMovement(sign){const item=$('m_item').value,qty=Number($('m_qty').value||0);if(!item||qty<=0)return toast('품목과 수량을 확인해주세요.');try{const {error}=await db.rpc('record_inventory_movement',{p_inventory_item_id:item,p_delta:sign*qty,p_tx_type:$('m_type').value,p_reason:$('m_reason').value.trim(),p_lot:$('m_lot').value.trim(),p_expiry:$('m_exp').value||null});if(error)throw error;toast('재고가 반영되었습니다.');closeModal();await init();route('inventory')}catch(e){toast('재고 처리 실패: '+(e.message||e))}}
function renderCalendar(){const now=window.__cal||new Date();const y=now.getFullYear(),m=now.getMonth();const first=new Date(y,m,1),last=new Date(y,m+1,0);const start=first.getDay();let cells='';for(let i=0;i<start;i++)cells+='<div class="day mutedday"></div>';for(let d=1;d<=last.getDate();d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const os=state.orders.filter(o=>o.ship_date===ds&&o.order_status!=='취소');const totals=new Map();os.forEach(o=>(o.order_items||[]).forEach(i=>{const name=i.product_name_snapshot||i.kit_name||'상품명 미상';totals.set(name,(totals.get(name)||0)+Number(i.quantity||0))}));const summary=[...totals.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko')).map(([name,qty])=>`<div class="mini">${esc(name)} ${fmt(qty)}개</div>`).join('');cells+=`<button type="button" class="day" style="text-align:left;width:100%;color:inherit;cursor:${os.length?'pointer':'default'}" ${os.length?`onclick="showCalendarDate('${ds}')"`: 'disabled'}><div class="n">${d}</div><div class="count">${os.length?os.length+'건 주문':''}</div>${summary}${os.length?'<div class="mini green" style="margin-top:5px">주문 내역 보기</div>':''}</button>`} $('page').innerHTML=`<div class="top"><div><h1>발송캘린더</h1><div class="muted">배송일별 상품 수량 합계 · 취소 주문 제외</div></div><div class="toolbar"><button class="btn secondary" onclick="window.__cal=new Date(${y},${m-1},1);renderCalendar()">‹</button><b>${y}년 ${m+1}월</b><button class="btn secondary" onclick="window.__cal=new Date(${y},${m+1},1);renderCalendar()">›</button><button class="btn secondary" onclick="exportShippingSchedule('${y}-${String(m+1).padStart(2,'0')}')">이달 발송 엑셀</button><button class="btn light" onclick="route('prep')">준비량 보기</button></div></div><div class="calendar">${cells}</div>`}

function selectedPrepMonth(){return $('prep_month')?.value || new Date().toISOString().slice(0,7)}
function monthlyOrderRows(month){return orderRows().filter(r=>String(r.order.ship_date||'').startsWith(month)&&r.order.order_status!=='취소'&&r.order.order_status!=='출고완료')}
function prepSummary(month){
 const rows=monthlyOrderRows(month), byItem=new Map(), byProduct=new Map();
 for(const r of rows){
  const qty=Number(r.quantity||0), productName=r.product_name_snapshot||r.kit_name||'상품명 미상';
  const itemId=r.inventory_item_id_snapshot||null, deduction=Number(r.inventory_deduction_snapshot??1), required=qty*deduction;
  const pk=productName; const pr=byProduct.get(pk)||{상품명:productName,주문수량:0,재고연결: itemId?'연결':'미연결'};pr.주문수량+=qty;byProduct.set(pk,pr);
  const item=state.items.find(i=>i.id===itemId); const key=itemId||('unlinked:'+productName);
  const it=byItem.get(key)||{재고품목:item?.name||(itemId?'품목정보없음':`미연결 상품: ${productName}`),단위:item?.unit||'',필요수량:0,관련상품:new Set(),연결여부:itemId?'연결':'미연결'};
  it.필요수량+=required;it.관련상품.add(productName);byItem.set(key,it);
 }
 return {rows, products:[...byProduct.values()].sort((a,b)=>a.상품명.localeCompare(b.상품명,'ko')), items:[...byItem.values()].map(x=>({...x,관련상품:[...x.관련상품].join(', ')})).sort((a,b)=>a.재고품목.localeCompare(b.재고품목,'ko'))};
}
function renderMonthlyPrep(){
 const month=window.__prepMonth||new Date().toISOString().slice(0,7); const {rows,products,items}=prepSummary(month);
 $('page').innerHTML=`<div class="top"><div><h1>월별 준비량</h1><div class="muted">배송일 기준 · 취소 및 출고완료 주문 제외 · 아직 출고되지 않은 주문만 준비량에 반영합니다.</div></div><div class="toolbar"><input id="prep_month" type="month" value="${month}" onchange="window.__prepMonth=this.value;renderMonthlyPrep()"><button class="btn primary" onclick="exportMonthlyPrep()">월별 준비량 엑셀</button></div></div>
 <div class="grid3"><div class="stat"><div class="label">대상 주문상품 행</div><div class="num">${fmt(rows.length)}건</div></div><div class="stat"><div class="label">상품 종류</div><div class="num">${fmt(products.length)}종</div></div><div class="stat"><div class="label">재고품목 종류</div><div class="num">${fmt(items.length)}종</div></div></div>
 <div class="panel"><h2 style="margin-top:0">재고품목별 준비 필요량</h2><div class="muted">상품과 재고품목이 연결되지 않은 경우 별도 ‘미연결 상품’으로 표시됩니다. 실제 생산/포장 전 연결 설정을 확인하세요.</div><div class="tablewrap"><table class="table"><thead><tr><th>재고품목</th><th>필요수량</th><th>단위</th><th>연결여부</th><th>관련 상품</th></tr></thead><tbody>${items.length?items.map(i=>`<tr><td><b>${esc(i.재고품목)}</b></td><td class="qty">${fmt(i.필요수량)}</td><td>${esc(i.단위)}</td><td><span class="badge ${i.연결여부==='연결'?'good':'warn'}">${i.연결여부}</span></td><td>${esc(i.관련상품)}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">선택한 달에 발송 예정 주문이 없습니다.</div></td></tr>`}</tbody></table></div></div>
 <div class="panel"><h2 style="margin-top:0">상품별 주문수량</h2><div class="tablewrap"><table class="table"><thead><tr><th>상품명</th><th>주문수량</th><th>재고 연결</th></tr></thead><tbody>${products.length?products.map(p=>`<tr><td>${esc(p.상품명)}</td><td class="qty">${fmt(p.주문수량)}</td><td><span class="badge ${p.재고연결==='연결'?'good':'warn'}">${p.재고연결}</span></td></tr>`).join(''):`<tr><td colspan="3"><div class="empty">주문 데이터가 없습니다.</div></td></tr>`}</tbody></table></div></div>`;
}
function exportMonthlyPrep(){
 const month=selectedPrepMonth();const {rows,products,items}=prepSummary(month);
 const wb=XLSX.utils.book_new();
 const itemRows=items.map(x=>({'재고품목':x.재고품목,'필요수량':x.필요수량,'단위':x.단위,'연결여부':x.연결여부,'관련상품':x.관련상품}));
 const productRows=products.map(x=>({'상품명':x.상품명,'주문수량':x.주문수량,'재고연결':x.재고연결}));
 const detailRows=rows.map(r=>({'배송일':r.order.ship_date||'','주문번호':r.order.order_no||'','고객/기관':r.order.customer_name||'','상품명':r.product_name_snapshot||r.kit_name||'','주문수량':Number(r.quantity||0),'차감단위수량':Number(r.inventory_deduction_snapshot??1),'재고품목ID':r.inventory_item_id_snapshot||'','재고필요수량':Number(r.quantity||0)*Number(r.inventory_deduction_snapshot??1),'주문상태':r.order.order_status||''}));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(itemRows),'재고품목별 준비량');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(productRows),'상품별 주문수량');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detailRows),'배송일별 상세');XLSX.writeFile(wb,`이로운과자점_${month}_월별준비량.xlsx`);
}
function exportShippingSchedule(month){
 const orders=state.orders.filter(o=>String(o.ship_date||'').startsWith(month)&&o.order_status!=='취소').sort((a,b)=>(a.ship_date||'').localeCompare(b.ship_date||'')||(a.customer_name||'').localeCompare(b.customer_name||'','ko'));
 const details=orders.map(o=>{const products=(o.order_items||[]).map(i=>`${i.product_name_snapshot||i.kit_name||'상품명 미상'} ${Number(i.quantity||0)}개`).join(' / ');return {'배송일':o.ship_date||'','주문번호':o.order_no||'','주문자/기관명':o.customer_name||'','담당자':o.manager_name||'','연락처':o.contact||'','배송지':o.address||'','수령방법':o.receive_method||'','주문상품 및 수량':products,'요청사항':o.note||'','주문상태':o.order_status||''}});
 const totals=new Map();orders.forEach(o=>(o.order_items||[]).forEach(i=>{const key=`${o.ship_date||''}\t${i.product_name_snapshot||i.kit_name||'상품명 미상'}`;const prev=totals.get(key)||{배송일:o.ship_date||'',상품명:i.product_name_snapshot||i.kit_name||'상품명 미상',합계수량:0};prev.합계수량+=Number(i.quantity||0);totals.set(key,prev)}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(details),'배송일별 주문자·상품');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([...totals.values()].sort((a,b)=>a.배송일.localeCompare(b.배송일)||a.상품명.localeCompare(b.상품명,'ko'))),'배송일별 상품합계');XLSX.writeFile(wb,`이로운과자점_${month}_배송일별주문상품.xlsx`);
}

function renderSettings(){ $('page').innerHTML=`<div class="top"><div><h1>설정</h1><div class="muted">현재 페이지의 운영 설정입니다.</div></div></div><div class="panel"><h2 style="margin-top:0">현재 운영 원칙</h2><div class="muted">주문 접수 자체는 재고를 차감하지 않습니다. 실제 출고완료 처리에서 재고가 차감됩니다. 생산관리는 추후 별도 페이지로 연결할 수 있습니다.</div></div><div class="panel"><h2 style="margin-top:0">관리자 비밀번호</h2><div class="muted">관리자 인증은 Supabase Auth를 사용합니다. 관리자 계정은 Supabase Authentication에서 관리합니다.</div></div>`}

$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
showApp()
