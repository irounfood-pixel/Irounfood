<body><div role="status" style="position:sticky;top:0;z-index:1000;padding:10px 14px;background:#e8f4ee;color:#24563b;border-bottom:1px solid #c7e4d2;text-align:center;font:700 13px/1.45 system-ui,-apple-system,sans-serif">운영 시스템입니다. 출고 처리 전 실제 재고 수량을 확인하세요.</div>

  <div class="loginbox">

<script>
const SUPABASE_URL='https://iqopdxrnkmpdivzndkxq.supabase.co';
const SUPABASE_KEY='sb_publishable_8jMegFjVcyhp1SIRZHosAQ_fVoxo8Nr';
const {createClient}=supabase; const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let state={page:'dashboard',orders:[],products:[],items:[],requests:[],movements:[],loading:false,errors:[]};
const menus=[['dashboard','대시보드'],['products','상품관리'],['inventory','재고관리'],['order','주문등록'],['orders','주문현황'],['orderprocess','주문처리'],['shipped','출고완료'],['requests','고객주문'],['partner','거래처 주문 승인'],['parcel','송장·포장박스'],['calendar','발송캘린더'],['prep','월별 준비량'],['settings','설정']];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
async function login(){
 const email=$('email').value.trim();
 const password=$('pw').value;
 if(!email||!password)return toast('이메일과 비밀번호를 입력해주세요.');
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error)return toast('로그인 실패: '+(error.message||error));
 await showApp();
}
async function logout(){await db.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pw').value='';}
async function showApp(){const {data}=await db.auth.getSession();if(!data.session){$('app').classList.add('hidden');$('login').classList.remove('hidden');return;}$('login').classList.add('hidden');$('app').classList.remove('hidden');renderNav();await init();}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('pw').focus()});
db.auth.onAuthStateChange((_event,session)=>{if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');renderNav();if(!state.loading) init();}else{$('app').classList.add('hidden');$('login').classList.remove('hidden');}});
// Make wide tables scroll horizontally from both the top and the bottom.
// Works after asynchronous table rendering without changing order or stock data.
const horizontalTableScrolls=new Map();
let horizontalTableFrame=0;
const horizontalTableResize=typeof ResizeObserver==='function'
 ?new ResizeObserver(()=>horizontalTableScrolls.forEach((entry,wrap)=>updateHorizontalTableScroll(wrap,entry)))
 :null;
function updateHorizontalTableScroll(wrap,entry){
 if(!wrap.isConnected)return;
 const max=wrap.scrollWidth-wrap.clientWidth;
 entry.bar.hidden=max<=2;
 if(entry.bar.hidden)return;
 entry.track.style.width=Math.ceil(wrap.scrollWidth)+'px';
 if(Math.abs(entry.bar.scrollLeft-wrap.scrollLeft)>1)entry.bar.scrollLeft=wrap.scrollLeft;
}
function setupHorizontalTableScrolls(){
 const page=$('page');
 if(!page)return;
 const wraps=new Set(page.querySelectorAll('.tablewrap'));
 for(const [wrap,entry] of horizontalTableScrolls){
  if(wraps.has(wrap))continue;
  horizontalTableResize?.unobserve(wrap);
  if(entry.table)horizontalTableResize?.unobserve(entry.table);
  horizontalTableScrolls.delete(wrap);
 }
 for(const wrap of wraps){
  if(horizontalTableScrolls.has(wrap)){
   updateHorizontalTableScroll(wrap,horizontalTableScrolls.get(wrap));continue;
  }
  const bar=document.createElement('div'),track=document.createElement('div');
  bar.className='table-scroll-top';
  bar.setAttribute('role','region');
  bar.setAttribute('aria-label','표 가로 스크롤');
  bar.tabIndex=0;
  bar.title='좌우로 움직여 표의 숨겨진 열을 확인하세요';
  track.className='table-scroll-track';
  track.style.height='1px';
  bar.appendChild(track);
  wrap.parentNode.insertBefore(bar,wrap);
  const entry={bar,track,table:wrap.querySelector('table')};
  horizontalTableScrolls.set(wrap,entry);
  bar.addEventListener('scroll',()=>{
   if(Math.abs(wrap.scrollLeft-bar.scrollLeft)>1)wrap.scrollLeft=bar.scrollLeft;
  },{passive:true});
  wrap.addEventListener('scroll',()=>{
   if(Math.abs(bar.scrollLeft-wrap.scrollLeft)>1)bar.scrollLeft=wrap.scrollLeft;
  },{passive:true});
  horizontalTableResize?.observe(wrap);
  if(entry.table)horizontalTableResize?.observe(entry.table);
  updateHorizontalTableScroll(wrap,entry);
 }
}
function scheduleHorizontalTableScrolls(){
 if(horizontalTableFrame)return;
 horizontalTableFrame=requestAnimationFrame(()=>{
  horizontalTableFrame=0;
  setupHorizontalTableScrolls();
 });
}
new MutationObserver(scheduleHorizontalTableScrolls).observe($('page'),{childList:true,subtree:true});
window.addEventListener('resize',scheduleHorizontalTableScrolls,{passive:true});

function renderNav(){$('nav').innerHTML=menus.map(([k,n])=>`<button class="${state.page===k?'active':''}" onclick="route('${k}')">${n}</button>`).join('')}
function route(p){state.page=p;renderNav();({dashboard:renderDashboard,order:renderOrderForm,orders:renderOrders,orderprocess:renderOrderProcessing,shipped:renderShippedOrders,requests:renderRequests,partner:renderPartnerOrders,parcel:renderParcelEditor,calendar:renderCalendar,prep:renderMonthlyPrep,products:renderProducts,inventory:renderInventory,settings:renderSettings}[p]||renderDashboard)()}
async function readTable(label,queryFactory){
 try{const {data,error}=await queryFactory();if(error){const message=label+': '+(error.message||'조회 오류');state.errors.push(message);console.error(message,error);return null;}return data||[];}
 catch(e){const message=label+': '+(e.message||e);state.errors.push(message);console.error(message,e);return null;}
}
async function loadAll(){state.loading=true;state.errors=[];try{
 const [os,pis,ii,cr,mv]=await Promise.all([
  readTable('주문',()=>db.from('orders').select('*,order_items(*)').order('ship_date',{ascending:true}).order('order_no',{ascending:true})),
  readTable('상품',()=>db.from('products').select('*').order('name')),
  readTable('재고품목',()=>db.from('inventory_items').select('*').order('name')),
  readTable('고객주문신청',()=>db.from('customer_order_requests').select('*,customer_order_request_items(*)').order('created_at',{ascending:false})),
  readTable('재고이력',()=>db.from('inventory_transactions').select('*').order('created_at',{ascending:false}).limit(200))
 ]);
 state.orders=os||[];state.products=pis||[];state.items=ii||[];state.requests=cr||[];state.movements=mv||[];
 if(state.errors.length)toast('일부 데이터 조회 실패: '+state.errors[0]);
 }catch(e){state.errors.push('초기화: '+(e.message||e));console.error(e);toast('데이터 조회 실패: '+(e.message||e));}finally{state.loading=false}}
let initPromise=null;async function init(){if(initPromise)return initPromise;initPromise=(async()=>{await loadAll();route(state.page)})();try{return await initPromise}finally{initPromise=null}}
function stat(label,num){return `<div class="stat"><div class="label">${label}</div><div class="num">${num}</div></div>`}
function activeProducts(){return state.products.filter(x=>x.active!==false)}
function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
function dateStr(d){return d?new Date(d).toLocaleDateString('ko-KR'):''}
function orderRows(){return state.orders.flatMap(o=>(o.order_items||[]).map(i=>({...i,order:o})))}
function renderDashboard(){
 const today=new Date().toISOString().slice(0,10); const tom=new Date(Date.now()+86400000).toISOString().slice(0,10);
 const todayCount=state.orders.filter(o=>o.ship_date===today&&o.order_status!=='취소').length; const tomCount=state.orders.filter(o=>o.ship_date===tom&&o.order_status!=='취소').length;
 const pending=state.orders.filter(o=>['주문접수','준비중'].includes(o.order_status||'주문접수')).length;
 const low=state.items.filter(i=>Number(i.current_qty)<0).length;

const ORDER_PHOTO_BUCKET='iroun-order-photos';
const PHOTO_LIMIT=5242880;
const photoBusy=new Set();
async function loadOrderPhotos(orderId){
 const panel=$('orderPhotos');
 if(!panel)return;
 panel.textContent='첨부파일 목록을 불러오는 중입니다.';
 const {data,error}=await db.from('order_photos')
  .select('id,order_id,original_name,created_at').eq('order_id',orderId).order('created_at',{ascending:false});
 if(!panel.isConnected||panel!==$('orderPhotos'))return;
 if(error){panel.textContent='사진 조회 실패: '+error.message;return;}
 if(!data?.length){panel.innerHTML='<div class="muted">첨부사진 0장</div>';return;}
 panel.innerHTML='<div class="muted" style="margin-bottom:4px">첨부사진 '+data.length+'장</div>'
  +data.map(photo=>'<div class="order-photo-file">'
   +'<span class="mini photo-name" title="'+esc(photo.original_name)+'">'+esc(photo.original_name)+'</span>'
   +'<button type="button" class="btn light" data-photo-id="'+photo.id+'" data-order-id="'+orderId+'" onclick="removeOrderPhoto(this.dataset.photoId,this.dataset.orderId)">삭제</button>'
   +'</div>').join('');
}

async function uploadOrderPhotos(orderId){
 const order=state.orders.find(x=>x.id===orderId);
 const input=$('orderPhotoInput'),button=$('orderPhotoUpload');
 if(!order||!input||!button||photoBusy.has(orderId))return;
 const files=Array.from(input.files||[]);
 if(!files.length)return toast('사진을 선택해주세요.');
 if(files.length>10)return toast('한 번에 최대 10장까지 업로드할 수 있습니다.');
 const validTypes={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
 for(const file of files){
  if(!validTypes[file.type]||file.size<=0||file.size>PHOTO_LIMIT)return toast('JPG·PNG·WEBP, 파일당 5MB 이하만 업로드할 수 있습니다.');
 }
 photoBusy.add(orderId);input.disabled=true;button.disabled=true;button.textContent='업로드 중';
 let completed=0;
 try{
  for(const file of files){
   const storagePath=orderId+'/'+crypto.randomUUID()+'.'+validTypes[file.type];
   const {error:uploadError}=await db.storage.from(ORDER_PHOTO_BUCKET).upload(storagePath,file,{cacheControl:'3600',contentType:file.type,upsert:false});
   if(uploadError)throw uploadError;
   const {error:metadataError}=await db.from('order_photos').insert({
    order_id:orderId,storage_path:storagePath,original_name:file.name.slice(0,255),content_type:file.type,size_bytes:file.size
   });
   if(metadataError){await db.storage.from(ORDER_PHOTO_BUCKET).remove([storagePath]);throw metadataError;}
   completed++;
  }
  toast('주문 '+order.order_no+' 사진 '+completed+'장 등록 완료');
 }catch(e){toast('사진 업로드 오류 ('+completed+'장 완료): '+(e.message||e))}
 finally{
  photoBusy.delete(orderId);input.disabled=false;button.disabled=false;button.textContent='사진 올리기';input.value='';
  await loadOrderPhotos(orderId);
  if(state.page==='parcel')void refreshParcelPhotoCounts();
 }
}
async function removeOrderPhoto(photoId,orderId){
 if(!confirm('선택한 주문 사진을 삭제할까요?'))return;
 const {data:photo,error:readError}=await db.from('order_photos').select('storage_path').eq('id',photoId).eq('order_id',orderId).single();
 if(readError)return toast('사진 확인 실패: '+readError.message);
 const {error:storageError}=await db.storage.from(ORDER_PHOTO_BUCKET).remove([photo.storage_path]);

function renderInventory(){ $('page').innerHTML=`<div class="top"><div><h1>재고관리</h1><div class="muted">수량 칸 오른쪽 위 +, 아래 − 버튼을 누르면 1개씩 즉시 저장됩니다. 직접 입력한 숫자는 저장 또는 Enter로 반영됩니다. 변경 이력은 자동 기록됩니다.</div></div><div class="toolbar"><button class="btn secondary" onclick="openInventoryItem()">+ 재고품목 추가</button></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>품목</th><th>구분</th><th>현재재고</th><th>단위</th><th>관리</th></tr></thead><tbody>${state.items.length?state.items.map(i=>`<tr><td><div class="stock-inline"><b>${esc(i.name)}</b><label class="mini" for="stock-qty-${i.id}">재고</label><span class="stock-qty-control"><input class="stock-qty-input" id="stock-qty-${i.id}" type="number" inputmode="decimal" min="0" step="0.001" value="${Number(i.current_qty??0)}" aria-label="${esc(i.name)} 재고 수량" onkeydown="if(event.key==='Enter'){event.preventDefault();saveInlineInventory('${i.id}')}"><span class="stock-step-stack"><button class="stock-step-btn" type="button" id="stock-plus-${i.id}" aria-label="${esc(i.name)} 수량 1 증가 및 즉시 저장" onclick="stepInlineInventory('${i.id}',1)">+</button><button class="stock-step-btn" type="button" id="stock-minus-${i.id}" aria-label="${esc(i.name)} 수량 1 감소 및 즉시 저장" onclick="stepInlineInventory('${i.id}',-1)">−</button></span></span><button class="btn primary" id="stock-save-${i.id}" onclick="saveInlineInventory('${i.id}')">저장</button></div></td><td>${esc(i.category||'')}</td><td class="qty ${Number(i.current_qty)<0?'dangertext':''}">${fmt(i.current_qty)}</td><td>${esc(i.unit||'')}</td><td><button class="btn light" onclick="openInventoryItem('${i.id}')">수정</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">재고품목이 없습니다.</div></td></tr>`}</tbody></table></div></div><div class="panel"><h2 style="margin:0">최근 재고이력</h2><div class="tablewrap"><table class="table"><thead><tr><th>일시</th><th>품목</th><th>수량</th><th>구분</th><th>사유</th></tr></thead><tbody>${state.movements.slice(0,50).map(m=>{const i=state.items.find(x= async function stepInlineInventory(id,step){
  const field=$('stock-qty-'+id);
  if(!field||field.disabled||stockSaving.has(id))return;
  const value=Number(field.value);
  if(field.value.trim()===''||!Number.isFinite(value)||value<0)return toast('재고 수량을 먼저 확인해주세요.');
  const next=Math.round((value+step)*1000)/1000;
  if(next<0)return toast('재고 수량은 0 미만으로 줄일 수 없습니다.');
  const previous=field.value;
  field.value=String(next);
  const plus=$('stock-plus-'+id),minus=$('stock-minus-'+id);
  if(plus)plus.disabled=true;
  if(minus)minus.disabled=true;
  try{const saved=await saveInlineInventory(id);if(!saved&&field.isConnected)field.value=previous;}finally{
    if(field.isConnected && !stockSaving.has(id)){
      if(plus)plus.disabled=false;
      if(minus)minus.disabled=false;
    }
  }
}

const stockSaving = new Set();
async function saveInlineInventory(id) {
  const item=state.items.find(i=>i.id===id);
  const field=$('stock-qty-'+id),button=$('stock-save-'+id);
  if(!item||!field||stockSaving.has(id))return;
  const raw=field.value.trim(),target=Number(raw),original=Number(item.current_qty??0);
  if(!raw||!Number.isFinite(target)||target<0||Math.abs(target-Math.round(target*1000)/1000)>1e-9){
    toast('재고 수량은 0 이상의 숫자로 소수점 셋째 자리까지 입력해주세요.');return;
  }
  if(Math.abs(original-target)<1e-9){toast('기존 재고와 같은 수량입니다.');return;}
  stockSaving.add(id);
  field.disabled=true;button.disabled=true;button.textContent='저장 중';
  try {
    const {data:latest,error:readError}=await db.from('inventory_items').select('current_qty').eq('id',id).single();
    if(readError)throw readError;
    if(Math.abs(Number(latest.current_qty??0)-original)>1e-9){
      throw new Error('다른 작업에서 재고가 변경됐습니다. 재고관리 화면을 새로고침한 후 다시 입력해주세요.');
    }
    const delta=Math.round((target-original)*1000)/1000;
    const {error}=await db.rpc('record_inventory_movement',{
      p_inventory_item_id:id,p_delta:delta,p_tx_type:'재고조정',
      p_reason:'재고관리 직접 입력 ('+original+' → '+target+')',
      p_lot:'',p_expiry:null
    });
    if(error)throw error;
    await loadAll();
    renderInventory();
    toast('재고가 '+fmt(target)+' '+(item.unit||'')+'(으)로 변경됐습니다.');
    return true;
  }catch(e){
    toast('재고 저장 실패: '+(e.message||e));
    return false;
  }finally{
    stockSaving.delete(id);
    if(field.isConnected)field.disabled=false;
    if(button.isConnected){button.disabled=false;button.textContent='저장';}
  }
}

  return '<tr><td><div class="parcel-order-number"><b>'+esc(o.order_no)+'</b><button type="button" class="parcel-detail-btn" data-id="'+o.id+'" aria-label="'+esc(o.order_no)+' 주문 상세보기" onclick="openParcelOrderDetail(this.dataset.id)">상세</button><button type="button" class="parcel-photo-btn" data-id="'+o.id+'" title="송장 입력 전에도 사진 첨부 가능" aria-label="'+esc(o.order_no)+' 주문 사진 첨부" onclick="openOrderPhotoManager(this.dataset.id)">사진 +</button><span class="parcel-photo-count" id="parcel-photo-count-'+o.id+'" aria-label="첨부사진 수">확인 중</span></div></td><td>'+esc(o.ship_date||'')+'</td><td style="min-width:240px;max-width:360px;white-space:normal;overflow-wrap:anywhere">'+esc(o.address||'미입력')+'</td>'
   +'<td><input class="parcel-track-input" id="parcel-track-'+o.id+'" aria-label="'+esc(o.order_no+' 송장번호')+'" placeholder="쉼표로 여러 개 입력" maxlength="1000" value="'+esc(d.tracking_numbers||'')+'"></td>'
   +boxes+'<td><button class="btn primary" id="parcel-save-'+o.id+'" data-id="'+o.id+'" onclick="saveInlineParcel(this.dataset.id)">저장</button></td>'
   +'</tr>';
 }).join('');
 page.innerHTML='<div class="top"><div><h1>송장·포장박스</h1><div class="muted">주문번호 옆 상세 버튼으로 주문 내용을 확인하고, 사진 +로 사진을 첨부할 수 있습니다. 송장·박스 변경 후 해당 행의 저장을 누르세요.</div></div><div class="toolbar"><button class="btn secondary" onclick="renderParcelEditor()">새로고침</button><button class="btn primary" id="parcel-export-xlsx" onclick="exportParcelDetails()">사진 포함 엑셀 다운로드</button></div></div>'
  +'<div class="panel"><p class="muted">박스 수량은 입력칸 오른쪽 위 + / 아래 − 버튼으로 1개씩 조절할 수 있습니다. 송장번호는 쉼표(,)로 구분합니다. 변경 후 행별 저장을 눌러야 엑셀에 반영됩니다.</p>'
  +'<div class="tablewrap"><table class="table parcel-table"><thead><tr><th>주문번호</th><th>발송일</th><th>배송지</th><th>송장번호</th>'+heads+'<th>저장</th></tr></thead><tbody>'
  +(rows||'<tr><td colspan="10"><div class="empty">주문이 없습니다.</div></td></tr>')+'</tbody></table></div></div>';
 if(orders.length)void refreshParcelPhotoCounts(orders);
}

async function refreshParcelPhotoCounts(orders=photoExportOrders()){
 if(state.page!=='parcel'||!orders.length)return;
 const ids=orders.map(o=>o.id);
 const countMap=new Map(ids.map(id=>[id,0]));
 try{
  for(let i=0;i<ids.length;i+=50){
   const batch=ids.slice(i,i+50);
   for(let page=0;;page++){
    const {data,error}=await db.from('order_photos').select('order_id').in('order_id',batch).range(page*500,page*500+499);
    if(error)throw error;
    for(const photo of data||[])countMap.set(photo.order_id,(countMap.get(photo.order_id)||0)+1);
    if(!data||data.length<500)break;
   }
  }
  if(state.page!=='parcel')return;
  for(const [id,n] of countMap){
   const label=$('parcel-photo-count-'+id);
   if(label)label.textContent=n+'장';
  }
 }catch(e){
  if(state.page!=='parcel')return;
  for(const id of ids){
   const label=$('parcel-photo-count-'+id);
   if(label)label.textContent='조회 실패';
  }
  toast('첨부사진 수 조회 실패: '+(e.message||e));
 }
}

 if(!order)return toast('주문을 찾을 수 없습니다.');

let photoExportBusy=false;
let excelJsScriptPromise=null;
// Only load the separate image-capable Excel engine when a user exports pictures.
function loadImageExcelEngine(){
 if(window.ExcelJS?.Workbook)return Promise.resolve(window.ExcelJS);
 if(excelJsScriptPromise)return excelJsScriptPromise;
 excelJsScriptPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
  script.async=true;
  script.onload=()=>window.ExcelJS?.Workbook?resolve(window.ExcelJS):reject(new Error('사진 포함 엑셀 모듈을 불러오지 못했습니다.'));
  script.onerror=()=>reject(new Error('사진 포함 엑셀 모듈 연결에 실패했습니다. 인터넷 연결을 확인해주세요.'));
  document.head.appendChild(script);
 }).catch(e=>{excelJsScriptPromise=null;throw e});
 return excelJsScriptPromise;
}
function photoExportHeaders(){
 return ['주문번호','주문일','발송일','주문자/기관','수령인/담당자','연락처','배송지',
  '송장번호','아이스박스 소','아이스박스 중','아이스박스 대','종이박스 중','종이박스 대',
  '총 박스 수','주문상태','상품명 및 수량','요청사항','첨부사진 수'];
}
function photoExportOrders(){
 // Photos are allowed before shipment details exist. Include such orders in the export.
 return (state.orders||[]).filter(o=>o.order_status!=='취소').slice()
  .sort((a,b)=>String(b.ship_date||'').localeCompare(String(a.ship_date||''))||
   String(a.order_no||'').localeCompare(String(b.order_no||'')));
}
async function loadOrderPhotosForExcel(orders){
 const result=[];
 const ids=orders.map(o=>o.id);
 for(let i=0;i<ids.length;i+=50){
  const group=ids.slice(i,i+50);
  for(let page=0;;page++){
   const {data,error}=await db.from('order_photos')
    .select('order_id,storage_path,original_name,created_at')
    .in('order_id',group).order('created_at',{ascending:true})
    .range(page*500,page*500+499);
   if(error)throw new Error('첨부사진 조회 실패: '+error.message);
   result.push(...(data||[]));
   if(result.length>200)throw new Error('첨부사진이 200장을 초과합니다. 전체 파일이 너무 커질 수 있어 현재는 다운로드를 중단합니다.');
   if(!data||data.length<500)break;
  }
 }
 return result;
}
async function photoBlobToExcelImage(blob){
 const decoded=await createImageBitmap(blob);
 try{
  if(!decoded.width||!decoded.height)throw new Error('이미지 크기를 확인하지 못했습니다.');
  const ratio=Math.min(1,1200/decoded.width,1200/decoded.height);
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(decoded.width*ratio));
  canvas.height=Math.max(1,Math.round(decoded.height*ratio));
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('이미지 변환을 사용할 수 없습니다.');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(decoded,0,0,canvas.width,canvas.height);
  const jpeg=await new Promise((resolve,reject)=>canvas.toBlob(
   v=>v?resolve(v):reject(new Error('이미지 JPEG 변환 실패')),'image/jpeg',0.84));
  const dataUrl=await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(reader.result);
   reader.onerror=()=>reject(new Error('사진을 읽지 못했습니다.'));
   reader.readAsDataURL(jpeg);
  });
  return {dataUrl,width:canvas.width,height:canvas.height};
 }finally{if(typeof decoded.close==='function')decoded.close();}
}
async function exportParcelDetails(){
 if(photoExportBusy)return;
 const orders=photoExportOrders();
 if(!orders.length)return toast('다운로드할 주문 내역이 없습니다.');
 const button=$('parcel-export-xlsx');
 photoExportBusy=true;
 if(button){button.disabled=true;button.textContent='사진 포함 엑셀 생성 중';}
 try{
  const [ExcelJS,photos]=await Promise.all([loadImageExcelEngine(),loadOrderPhotosForExcel(orders)]);
  const details=window.__parcelDetails||{};
  const byOrder=new Map();
  for(const photo of photos){
   if(!byOrder.has(photo.order_id))byOrder.set(photo.order_id,[]);
   byOrder.get(photo.order_id).push(photo);
  }
  const workbook=new ExcelJS.Workbook();
  workbook.creator='이로운과자점';
  workbook.created=new Date();
  const summary=workbook.addWorksheet('송장포장박스');
  const headers=photoExportHeaders();
  summary.addRow(headers);
  const widths=[17,13,13,24,22,19,38,42,16,16,16,16,16,15,14,45,30,14];
  summary.columns=widths.map(w=>({width:w}));
  summary.views=[{state:'frozen',ySplit:1}];
  summary.autoFilter={from:'A1',to:'R1'};
  summary.getRow(1).font={bold:true,color:{argb:'FFFFFFFF'}};
  summary.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF315C4A'}};
  for(const order of orders){
   const d=details[order.id]||{};
   const boxes=parcelFields.map(([key])=>Number(d[key]||0));
   const row=summary.addRow([
    String(order.order_no||''),String(order.order_date||''),String(order.ship_date||''),
    String(order.customer_name||''),String(order.manager_name||order.customer_name||''),
    String(order.contact||''),String(order.address||''),String(d.tracking_numbers||''),
    ...boxes,boxes.reduce((a,b)=>a+b,0),String(order.order_status||''),
    (order.order_items||[]).map(i=>
     String(i.product_name_snapshot||i.kit_name||'')+' × '+Number(i.quantity||0)).join(' / '),
    String(order.note||''),(byOrder.get(order.id)||[]).length
   ]);
   for(const col of [1,6,8]){const cell=row.getCell(col);cell.numFmt='@';cell.value=String(cell.value??'');}
   row.alignment={vertical:'middle'};
   row.height=25;
  }
  const photosSheet=workbook.addWorksheet('주문사진');
  photosSheet.columns=[
   {header:'주문번호',width:18},{header:'주문자/기관',width:26},
   {header:'배송일',width:16},{header:'파일명',width:35},
   {header:'사진 등록일',width:23},{header:'첨부 사진',width:33}
  ];
  photosSheet.views=[{state:'frozen',ySplit:1}];
  photosSheet.getRow(1).font={bold:true,color:{argb:'FFFFFFFF'}};
  photosSheet.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF315C4A'}};
  const orderById=new Map(orders.map(o=>[o.id,o]));
  if(!photos.length){
   photosSheet.addRow(['등록된 주문 사진이 없습니다.']);
  }else{
   for(let i=0;i<photos.length;i++){
    const photo=photos[i],order=orderById.get(photo.order_id);
    if(!order)continue;
    if(button)button.textContent='사진 포함 중 ('+(i+1)+'/'+photos.length+')';
    const {data:blob,error:downloadError}=await db.storage
     .from(ORDER_PHOTO_BUCKET).download(photo.storage_path);
    if(downloadError||!blob)throw new Error(
     '주문 '+order.order_no+' 사진 '+(photo.original_name||'')+'을(를) 가져오지 못했습니다: '+(downloadError?.message||'파일 없음'));
    const converted=await photoBlobToExcelImage(blob);
    const row=photosSheet.addRow([
     String(order.order_no||''),String(order.customer_name||''),
     String(order.ship_date||''),String(photo.original_name||''),
     String(photo.created_at||'').slice(0,19).replace('T',' '),''
    ]);
    row.getCell(1).numFmt='@';
    row.height=115;
    row.alignment={vertical:'middle'};
    const imageId=workbook.addImage({base64:converted.dataUrl,extension:'jpeg'});
    const ratio=Math.min(190/converted.width,145/converted.height,1);
    photosSheet.addImage(imageId,{
     tl:{col:5,row:row.number-1},
     ext:{width:converted.width*ratio,height:converted.height*ratio},
     editAs:'oneCell'
    });
   }
  }
  if(button)button.textContent='엑셀 파일 생성 중';
  const bytes=await workbook.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([bytes],{
   type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  }));
  const link=document.createElement('a');
  link.href=url;
  link.download='이로운과자점_송장포장박스_주문사진포함.xlsx';
  document.body.appendChild(link);
  link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('주문 '+orders.length+'건, 첨부사진 '+photos.length+'장이 엑셀에 포함되었습니다.');
 }catch(e){
  toast('사진 포함 엑셀 다운로드 실패: '+(e.message||e));
 }finally{
  photoExportBusy=false;
  if(button?.isConnected){button.disabled=false;button.textContent='사진 포함 엑셀 다운로드';}
 }
}

function stepParcelBox(orderId,key,step){
 if(!parcelFields.some(([field])=>field===key)||parcelBusy.has(orderId))return;
 const field=$('parcel-'+key+'-'+orderId);
 if(!field)return;
 const raw=field.value.trim();
 if(!/^\d+$/.test(raw))return toast('박스 수량은 0~1000의 정수로 입력해주세요.');
 const value=Number(raw);
 if(!Number.isSafeInteger(value)||value<0||value>1000)return toast('박스 수량은 0~1000의 정수로 입력해주세요.');
 const next=value+step;
 if(next<0||next>1000)return toast('박스 수량은 0~1000개까지 입력할 수 있습니다.');
 field.value=String(next);
}
async function saveInlineParcel(id){
 if(parcelBusy.has(id))return;
 const order=state.orders.find(x=>x.id===id);
 if(!order)return toast('주문을 찾을 수 없습니다.');
 const track=$('parcel-track-'+id);
 const button=$('parcel-save-'+id);
 if(!track||!button)return;
 const tracking=track.value.trim();
 if(tracking.length>1000)return toast('송장번호는 1000자 이내로 입력해주세요.');
 const counts=[];
 for(const [key] of parcelFields){
  const input=$('parcel-'+key+'-'+id),raw=input?.value.trim()??'';
  if(!/^\d+$/.test(raw)||Number(raw)>1000)return toast('박스별 수량은 0~1000의 정수로 입력하세요.');
  counts.push(Number(raw));
 }
 const original=window.__parcelDetails?.[id]||null;
 if(original&&tracking===String(original.tracking_numbers||'')&&parcelFields.every(([k],i)=>counts[i]===Number(original[k]||0)))return toast('변경된 내용이 없습니다.');
 parcelBusy.add(id);button.disabled=true;button.textContent='저장 중';
 try{
  const {data:current,error:checkError}=await db.from('order_shipping_details').select('*').eq('order_id',id).maybeSingle();
  if(checkError)throw checkError;
  if((original?.updated_at||null)!==(current?.updated_at||null))throw new Error('다른 작업에서 출고정보가 변경됐습니다. 새로고침 후 다시 입력해주세요.');
  const {error}=await db.rpc('admin_save_order_shipping',{
   p_order_id:id,p_tracking:tracking,
   p_ice_small:counts[0],p_ice_medium:counts[1],p_ice_large:counts[2],
   p_paper_medium:counts[3],p_paper_large:counts[4]
  });
  if(error)throw error;
  const {data:updated,error:refreshError}=await db.from('order_shipping_details').select('*').eq('order_id',id).single();
  if(refreshError)throw refreshError;
  window.__parcelDetails[id]=updated;
  toast('주문 '+order.order_no+' 송장·박스 저장 완료');
 }catch(e){toast('출고정보 저장 실패: '+(e.message||e))}
 finally{parcelBusy.delete(id);button.disabled=false;button.textContent='저장';}
}
