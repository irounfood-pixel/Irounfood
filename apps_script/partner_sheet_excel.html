<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><base target="_top">
<style>
body{font:14px Arial,sans-serif;color:#26372b;margin:17px}h3{margin:12px 0 7px}
button{border:0;border-radius:8px;padding:10px 14px;background:#31654a;color:white;margin:5px 5px 5px 0;cursor:pointer}
button.secondary{background:#e9eee9;color:#29593b}button:disabled{opacity:.4}
.note{color:#5f7065;font-size:12px}.err{color:#b3322a;white-space:pre-wrap}
.box{border:1px solid #d7e3d9;border-radius:10px;padding:12px;margin:12px 0}
input{margin:7px 0}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #e2e8e4;padding:7px;text-align:left}
#preview{max-height:180px;overflow:auto}
</style></head><body>
<h3>이로운과자점 거래처 주문서</h3>
<p class="note">거래처 입력: A~H / 관리자 전용: I~N. 주문이 완성되면 별도 제출 버튼 없이 자동 승인 대기로 전송되는 구조입니다(서버 연결 후 활성화).</p>
<div class="box">
 <b>엑셀 다운로드</b><p class="note">빈 양식과 현재 거래처 주문내역을 각각 .xlsx로 다운로드합니다.</p>
 <button onclick="downloadBlank()">빈 주문 양식 다운로드</button>
 <button class="secondary" onclick="downloadCurrent()">주문내역 다운로드</button>
</div>
<div class="box">
 <b>엑셀 업로드</b><p class="note">표준 14개 열의 .xlsx 파일을 선택하세요. 관리자 전용 I~N열은 업로드하지 않으며, 기존 행을 덮어쓰지 않습니다.</p>
 <input id="file" type="file" accept=".xlsx,.xls" onchange="readExcel(event)">
 <div id="preview"></div><div id="message" class="note"></div>
 <button id="upload" disabled onclick="uploadRows()">검증된 주문 추가</button>
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
const head=['주문일','발송일','상품명','수량','수령인','연락처','배송지','요청사항',
 '송장번호','아이스박스 소','아이스박스 중','아이스박스 대','종이박스 중','종이박스 대'];
let parsed=[];
const $=id=>document.getElementById(id);
function status(text,err=false){$('message').textContent=text;$('message').className=err?'err':'note'}
function excel(rows,name){
 const w=XLSX.utils.book_new(),s=XLSX.utils.aoa_to_sheet(rows);
 s['!cols']=[{wch:14},{wch:14},{wch:25},{wch:10},{wch:18},{wch:19},{wch:42},{wch:32},{wch:38},
  {wch:17},{wch:17},{wch:17},{wch:17},{wch:17}];
 XLSX.utils.book_append_sheet(w,s,'주문입력');XLSX.writeFile(w,name);
}
function downloadBlank(){excel([head],'이로운과자점_빈_주문양식.xlsx')}
function downloadCurrent(){
 status('주문내역을 불러오는 중입니다.');
 google.script.run.withSuccessHandler(data=>{
  excel([data.headers,...data.rows],'이로운과자점_주문내역.xlsx');status('다운로드 완료');
 }).withFailureHandler(err=>status(err.message,true)).getPartnerRowsForExport();
}
function clean(x){return String(x??'').trim()}
function readExcel(e){
 parsed=[];$('upload').disabled=true;$('preview').textContent='';
 const file=e.target.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try {
   const wb=XLSX.read(reader.result,{type:'array',cellDates:false});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const data=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
   if(!data.length||head.some((h,i)=>clean(data[0]?.[i])!==h))throw Error('첫 번째 행에 14개 표준 열이 정확히 있어야 합니다.');
   parsed=data.slice(1).filter(r=>r.some(v=>clean(v)!==''));
   if(!parsed.length)throw Error('업로드할 주문 데이터가 없습니다.');
   if(parsed.length>500)throw Error('한 번에 500행까지 업로드 가능합니다.');
   if(parsed.some(r=>r.length>14))throw Error('14개 열 외의 데이터가 포함되어 있습니다.');
   const tbl=document.createElement('table');tbl.innerHTML='<tr><th>주문일</th><th>발송일</th><th>상품명</th><th>수량</th><th>수령인</th></tr>';
   parsed.slice(0,5).forEach(r=>{const tr=document.createElement('tr');r.slice(0,5).forEach(v=>{const td=document.createElement('td');td.textContent=clean(v);tr.appendChild(td)});tbl.appendChild(tr)});
   $('preview').appendChild(tbl);
   status(parsed.length+'행 검토 준비. 확인 후 주문을 추가하세요.');
   $('upload').disabled=false;
  }catch(err){status(err.message,true)}
 };
 reader.readAsArrayBuffer(file);
}
function uploadRows(){
 if(!parsed.length)return;$('upload').disabled=true;status('입력 내용을 확인하는 중입니다.');
 google.script.run.withSuccessHandler(result=>{
   if(!result.ok){status('오류: '+result.errors.join('\n'),true);$('upload').disabled=false;return}
   status('추가 '+result.added+'행 / 동일 내용 건너뜀 '+result.skipped+'행. 자동 승인 대기 연동은 별도 서버 설정 후 동작합니다.');
   parsed=[];
 }).withFailureHandler(err=>{status(err.message,true);$('upload').disabled=false}).appendPartnerExcelRows(parsed);
}
</script></body></html>
