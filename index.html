<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ef">
<title>이로운과자점 | 주문 안내</title>
<style>
:root{color-scheme:light;--ink:#28241f;--muted:#716b63;--line:#e7dfd4;--paper:#fffdf9;--accent:#795b43;--bg:#f7f4ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{width:min(760px,100% - 32px);margin:56px auto}
header{margin-bottom:28px}header p{color:var(--muted);line-height:1.7}
h1{font-size:clamp(28px,5vw,40px);margin:0 0 10px;letter-spacing:-.04em}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:180px;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.tag{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em}
h2{font-size:21px;margin:12px 0 8px} .desc{font-size:14px;color:var(--muted);line-height:1.65}
footer{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:560px){main{margin:28px auto}.cards{grid-template-columns:1fr}a.card{min-height:auto}}
</style>
</head>
<body><div role="alert" style="position:sticky;top:0;z-index:1000;padding:10px 14px;background:#fff0d2;color:#684d11;border-bottom:1px solid #e7cf9b;text-align:center;font:700 13px/1.45 system-ui,-apple-system,sans-serif">테스트 공개 페이지입니다. 주문은 실제 접수되지 않습니다. 실제 연락처·배송지 대신 테스트 정보만 입력해 주세요.</div>
<main>
<header>
  <h1>이로운과자점</h1>
  <p>아동요리·베이킹 키트 주문 안내 페이지입니다.<br>이용 목적에 맞는 메뉴를 선택해 주세요.</p>
</header>
<section class="cards" aria-label="메뉴">
  <a class="card" href="./customer.html">
    <span class="tag">CUSTOMER</span>
    <h2>키트 주문 신청</h2>
    <div class="desc">상품을 확인하고 배송 정보를 입력해 주문 신청을 제출합니다.</div>
  </a>
  <a class="card" href="./admin.html">
    <span class="tag">ADMIN</span>
    <h2>관리자 주문 관리</h2>
    <div class="desc">관리자 로그인 후 주문 승인, 재고 관리, 출고 및 엑셀 내보내기를 이용합니다.</div>
  </a>
</section>
<footer>
  주문 신청은 관리자가 확인한 뒤 확정됩니다.<br>
  문의 사항은 이로운과자점으로 연락해 주세요.
</footer>
</main>
</body>
</html>
