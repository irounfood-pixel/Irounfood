<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>이로운과자점 주문관리</title>
<style>
:root{--p:#315c4a;--bg:#f5f7f5;--text:#26332d;--muted:#748078;--line:#e1e7e2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}input,textarea{font-size:16px}.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;z-index:20}.logo{font-weight:800;font-size:20px;color:var(--p);padding:8px 10px 22px}.logo small{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}.nav button{display:block;width:100%;border:0;background:#fff;color:#59655f;text-align:left;padding:13px 12px;border-radius:10px;margin:4px 0;font-weight:600}.nav button.active,.nav button:hover{background:#edf4ef;color:var(--p)}.main{margin-left:220px;padding:28px;max-width:1400px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;min-height:42px}.primary{background:var(--p);color:#fff}.secondary{background:#edf2ee;color:var(--p)}.danger{background:#fae9e8;color:#b83e3a}.btn:disabled{opacity:.55}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:18px}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:28px;font-weight:800;margin-top:8px}.panel{padding:18px;margin-top:16px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;color:#68736d;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #d5ded8;border-radius:9px;background:#fff;padding:12px;outline:none}.field textarea{min-height:90px;resize:vertical}.kitbox{border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto}.kitrow{display:grid;grid-template-columns:1fr 110px;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f0}.kitrow input{text-align:right}.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.searchbar input{border:1px solid var(--line);border-radius:8px;padding:10px;min-height:42px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:12px;color:var(--muted);background:#fafbfa}.num{text-align:right}.badge{display:inline-block;padding:4px 8px;border-radius:18px;font-size:11px;font-weight:700}.green{background:#e8f4ed;color:#28704b}.red{background:#fae9e8;color:#b83e3a}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.calhead{padding:9px;background:#fafbfa;font-size:12px;color:var(--muted);font-weight:700}.day{min-height:105px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:7px;background:#fff}.event{background:#edf4ef;color:var(--p);border-radius:6px;padding:5px;margin-top:5px;font-size:10px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(20,30,25,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border:0;border-radius:50%;background:#f0f3f1;font-size:22px}.notice{padding:11px 13px;border-radius:9px;background:#f5f8f5;color:#637069;font-size:13px;margin-bottom:12px}.empty{padding:28px;text-align:center;color:var(--muted)}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#26332d;color:#fff;padding:11px 16px;border-radius:9px;z-index:200;display:none;font-size:13px}
@media(max-width:850px){.side{width:100%;height:58px;bottom:auto;padding:0 8px;display:flex;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.logo{font-size:0;width:42px;padding:0;text-align:center}.logo:before{content:"이";font-size:20px}.logo small{display:none}.nav{display:flex;flex:1;gap:3px}.nav button{font-size:0;text-align:center;padding:8px 4px;margin:0;min-height:44px}.nav button:before{font-size:19px}.nav button:nth-child(1):before{content:"⌂"}.nav button:nth-child(2):before{content:"＋"}.nav button:nth-child(3):before{content:"≡"}.nav button:nth-child(4):before{content:"▦"}.nav button:nth-child(5):before{content:"◫"}.nav button:nth-child(6):before{content:"⚙"}.main{margin-left:0;padding:78px 12px 24px}h1{font-size:22px}.grid4{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat .num{font-size:22px}.formgrid{grid-template-columns:1fr}.panel{padding:13px}.calendar{font-size:10px}.day{min-height:78px;padding:5px}table{font-size:12px}th,td{padding:8px 6px}}
</style></head><body>
<aside class="side"><div class="logo">이로운과자점<small>주문 및 발송 관리</small></div><nav class="nav">
<button class="active" data-page="dashboard" onclick="showPage('dashboard',this)">대시보드</button><button data-page="order" onclick="openOrder()">주문등록</button><button data-page="orders" onclick="showPage('orders',this)">주문현황</button><button data-page="calendar" onclick="showPage('calendar',this)">발송캘린더</button><button data-page="kits" onclick="showPage('kits',this)">키트별현황</button><button data-page="settings" onclick="showPage('settings',this)">설정</button></nav></aside>
<main class="main">
<section id="dashboard"><div class="top"><div><h1>안녕하세요, 이로운과자점</h1><p class="muted" id="todayText"></p></div><button class="btn primary" onclick="openOrder()">＋ 새 주문</button></div><div class="grid4"><div class="stat"><div class="label">오늘 발송</div><div class="num" id="sToday">0건</div></div><div class="stat"><div class="label">내일 발송</div><div class="num" id="sTomorrow">0건</div></div><div class="stat"><div class="label">준비 필요</div><div class="num" id="sPrepare">0종</div></div><div class="stat"><div class="label">부족 키트</div><div class="num" id="sNeed">0종</div></div></div><div class="panel"><div class="between"><h2>다가오는 발송</h2><button class="btn secondary" onclick="showPage('calendar')">캘린더 보기</button></div><div id="upcoming" class="empty">불러오는 중...</div></div></section>
<section id="order" class="hidden"><div class="top"><div><h1 id="orderPageTitle">새 주문 등록</h1><p class="muted">배송지, 발송일, 키트 수량을 입력하세요.</p></div></div><div class="panel"><div class="notice">주문번호는 자동 생성됩니다. 주문 등록은 실제 재고를 차감하지 않습니다.</div><div class="formgrid"><div class="field"><label>주문번호</label><input id="orderNo" readonly></div><div class="field"><label>발송일</label><input id="shipDate" type="date"></div><div class="field" style="grid-column:1/-1"><label>배송지</label><input id="address" type="text" placeholder="배송지 주소를 입력하세요"></div><div class="field" style="grid-column:1/-1"><label>요청사항</label><textarea id="note" placeholder="요청사항이 있으면 입력하세요"></textarea></div></div><div style="margin-top:16px"><label style="font-size:12px;font-weight:700;color:#68736d">키트 수량</label><div class="kitbox" id="kitInputs"></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn secondary" onclick="showPage('dashboard')">취소</button><button class="btn primary" id="saveOrderBtn" onclick="saveOrder()">주문 저장</button></div></div></section>
<section id="orders" class="hidden"><div class="top"><div><h1>주문현황</h1><p class="muted">등록된 주문을 검색하고 수정·삭제합니다.</p></div><button class="btn primary" onclick="openOrder()">＋ 새 주문</button></div><div class="panel"><div class="searchbar"><input id="search" placeholder="주문번호 또는 배송지 검색" oninput="renderOrders()"><input id="filterDate" type="date" onchange="renderOrders()"></div><div id="ordersTable"></div></div></section>
<section id="calendar" class="hidden"><div class="top"><div><h1>발송 캘린더</h1><p class="muted">날짜별 발송 주문을 확인합니다.</p></div><div style="display:flex;gap:6px;align-items:center"><button class="btn secondary" onclick="moveMonth(-1)">‹</button><b id="monthTitle"></b><button class="btn secondary" onclick="moveMonth(1)">›</button></div></div><div class="panel"><div id="calendarGrid"></div></div></section>
<section id="kits" class="hidden"><div class="top"><div><h1>키트별 현황</h1><p class="muted">등록된 주문 기준 필요 수량을 계산합니다.</p></div></div><div class="panel"><div id="kitTable"></div></div></section>
<section id="settings" class="hidden"><div class="top"><div><h1>설정</h1><p class="muted">현재 재고를 입력합니다. 주문 등록과 별도로 관리됩니다.</p></div></div><div class="panel"><div id="stockInputs"></div><div style="text-align:right;margin-top:15px"><button class="btn primary" onclick="saveStock()">재고 저장</button></div></div></section>
</main><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">주문 상세</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast"></div>
<script>
const SUPABASE_URL="https://iqopdxrnkmpdivzndkxq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_8jMegFjVcyhp1SIRZHosAQ_fVoxo8Nr";
const kits=["과자집","감자샐러드샌드위치","초코스틱","튀밥강정","화과자","경단","글자생과자","캐릭터생과자","뻥스케이크","식빵카나페","도넛","표정컵케이크"];
let orders=[],stock={},editingOrderNo=null,calDate=new Date();
function $(id){return document.getElementById(id)}
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display="none",2200)}
function todayStr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nextOrderNo(){const nums=orders.map(o=>parseInt(o.no,10)).filter(Number.isFinite);const base=Number(String(new Date().getFullYear()).slice(2)+"0000");return String(Math.max(base,...nums)+1)}
function saveLocal(){localStorage.setItem("iroonOrders_v3",JSON.stringify(orders));localStorage.setItem("iroonStock_v3",JSON.stringify(stock))}
function loadLocal(){try{orders=JSON.parse(localStorage.getItem("iroonOrders_v3")||"[]")}catch(e){orders=[]}try{stock=JSON.parse(localStorage.getItem("iroonStock_v3")||"{}")}catch(e){stock={}}kits.forEach(k=>{if(stock[k]==null)stock[k]=0})}
function headers(){return {apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json",Prefer:"return=representation"}}
async function dbGet(){const r=await fetch(SUPABASE_URL+"/rest/v1/orders?select=id,order_no,address,ship_date,note,created_at,updated_at,order_items(id,kit_name,quantity)&order=ship_date.asc,order_no.asc",{headers:headers()});if(!r.ok)throw Error("DB 조회 "+r.status);const d=await r.json();const sr=await fetch(SUPABASE_URL+"/rest/v1/stock?select=kit_name,quantity",{headers:headers()});if(!sr.ok)throw Error("재고 조회 "+sr.status);const s=await sr.json();return {orders:(d||[]).map(o=>({id:o.id,no:o.order_no,address:o.address,shipDate:o.ship_date,note:o.note||"",created:o.created_at,updated:o.updated_at,items:Object.fromEntries((o.order_items||[]).map(x=>[x.kit_name,Number(x.quantity)||0]))})),stock:s||[]}}
async function dbSaveOrder(o){const payload={order_no:o.no,address:o.address,ship_date:o.shipDate,note:o.note||""};let r;if(o.id)r=await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(o.id),{method:"PATCH",headers:headers(),body:JSON.stringify(payload)});else{r=await fetch(SUPABASE_URL+"/rest/v1/orders",{method:"POST",headers:headers(),body:JSON.stringify(payload)});if(r.ok){const a=await r.json();if(a[0])o.id=a[0].id}}if(!r.ok)throw Error("주문 저장 "+r.status);if(o.id){await fetch(SUPABASE_URL+"/rest/v1/order_items?order_id=eq."+encodeURIComponent(o.id),{method:"DELETE",headers:headers()});const rows=Object.entries(o.items).map(([kit_name,quantity])=>({order_id:o.id,kit_name,quantity}));if(rows.length){const ir=await fetch(SUPABASE_URL+"/rest/v1/order_items",{method:"POST",headers:headers(),body:JSON.stringify(rows)});if(!ir.ok)throw Error("품목 저장 "+ir.status)}}}
async function dbDeleteOrder(o){if(!o.id)return;const r=await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(o.id),{method:"DELETE",headers:headers()});if(!r.ok)throw Error("삭제 "+r.status)}
async function dbSaveStock(){const rows=kits.map(k=>({kit_name:k,quantity:Number(stock[k])||0}));const h={...headers(),Prefer:"resolution=merge-duplicates,return=representation"};const r=await fetch(SUPABASE_URL+"/rest/v1/stock?on_conflict=kit_name",{method:"POST",headers:h,body:JSON.stringify(rows)});if(!r.ok)throw Error("재고 저장 "+r.status)}
function initKitInputs(){$("kitInputs").innerHTML=kits.map(k=>`<div class="kitrow"><span>${k}</span><input type="number" min="0" inputmode="numeric" value="0" data-kit="${k}"></div>`).join("")}
function openOrder(){editingOrderNo=null;showPage("order");$("orderPageTitle").textContent="새 주문 등록";$("saveOrderBtn").textContent="주문 저장";$("orderNo").value=nextOrderNo();$("shipDate").value=todayStr(new Date(Date.now()+86400000));$("address").value="";$("note").value="";document.querySelectorAll("#kitInputs input").forEach(i=>i.value="0");setTimeout(()=>$("address").focus(),80)}
function showPage(id,btn){document.querySelectorAll("main section").forEach(p=>p.classList.add("hidden"));$(id).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));const b=btn||document.querySelector('.nav button[data-page="'+id+'"]');if(b)b.classList.add("active");if(id==="orders")renderOrders();if(id==="calendar")renderCalendar();if(id==="kits")renderKits();if(id==="settings")renderStock();window.scrollTo(0,0)}
async function saveOrder(){const address=$("address").value.trim(),shipDate=$("shipDate").value,note=$("note").value.trim();if(!address||!shipDate){alert("배송지와 발송일을 입력해주세요.");return}const items={};document.querySelectorAll("#kitInputs input").forEach(i=>{const q=Number(i.value)||0;if(q>0)items[i.dataset.kit]=q});if(!Object.keys(items).length){alert("키트 수량을 하나 이상 입력해주세요.");return}const btn=$("saveOrderBtn");btn.disabled=true;const no=editingOrderNo||$("orderNo").value;let o=orders.find(x=>String(x.no)===String(no));if(o){o.address=address;o.shipDate=shipDate;o.note=note;o.items=items}else{o={no,address,shipDate,note,items,created:new Date().toISOString()};orders.push(o)}saveLocal();renderAll();let synced=false;try{await dbSaveOrder(o);synced=true}catch(e){console.warn(e)}btn.disabled=false;editingOrderNo=null;toast(synced?"주문이 저장되었습니다.":"주문이 저장되었습니다. (이 기기에 보관됨)");showPage("orders")}
function renderOrders(){const q=($("search")?.value||"").toLowerCase(),fd=$("filterDate")?.value||"";const a=orders.filter(o=>(!q||String(o.no).includes(q)||String(o.address||"").toLowerCase().includes(q))&&(!fd||o.shipDate===fd)).sort((x,y)=>String(x.shipDate).localeCompare(String(y.shipDate)));if(!a.length){$("ordersTable").innerHTML='<div class="empty">등록된 주문이 없습니다.</div>';return}$("ordersTable").innerHTML='<div style="overflow:auto"><table><thead><tr><th>주문번호</th><th>배송지</th><th>발송일</th><th>키트</th><th>수량</th><th>관리</th></tr></thead><tbody>'+a.map(o=>{const t=Object.values(o.items||{}).reduce((x,y)=>x+Number(y||0),0);return `<tr><td><b>${o.no}</b></td><td>${esc(o.address)}</td><td>${o.shipDate}</td><td>${Object.keys(o.items||{}).slice(0,2).join(", ")}${Object.keys(o.items||{}).length>2?" 외":""}</td><td>${t}개</td><td><div style="display:flex;gap:5px"><button class="btn secondary" onclick="detail('${o.no}')">상세</button><button class="btn secondary" onclick="editOrder('${o.no}')">수정</button><button class="btn danger" onclick="deleteOrder('${o.no}')">삭제</button></div></td></tr>`}).join("")+'</tbody></table></div>'}
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function detail(no){const o=orders.find(x=>String(x.no)===String(no));if(!o)return;$("modalTitle").textContent="주문 "+o.no;$("modalBody").innerHTML=`<p><b>배송지</b><br>${esc(o.address)}</p><p><b>발송일</b><br>${o.shipDate}</p><table><tbody>${Object.entries(o.items||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}개</td></tr>`).join("")}</tbody></table>${o.note?`<p><b>요청사항</b><br>${esc(o.note)}</p>`:""}<div style="display:flex;justify-content:flex-end;gap:7px;margin-top:16px"><button class="btn secondary" onclick="closeModal()">닫기</button><button class="btn secondary" onclick="editOrder('${o.no}')">수정</button><button class="btn danger" onclick="deleteOrder('${o.no}')">삭제</button></div>`;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
function editOrder(no){const o=orders.find(x=>String(x.no)===String(no));if(!o)return;closeModal();editingOrderNo=String(o.no);showPage("order");$("orderPageTitle").textContent="주문 "+o.no+" 수정";$("saveOrderBtn").textContent="수정 저장";$("orderNo").value=o.no;$("shipDate").value=o.shipDate||"";$("address").value=o.address||"";$("note").value=o.note||"";document.querySelectorAll("#kitInputs input").forEach(i=>i.value=(o.items||{})[i.dataset.kit]||0);setTimeout(()=>$("address").focus(),80)}
async function deleteOrder(no){const o=orders.find(x=>String(x.no)===String(no));if(!o||!confirm(`주문 ${o.no}을(를) 삭제하시겠습니까?`))return;orders=orders.filter(x=>String(x.no)!==String(no));saveLocal();renderAll();closeModal();try{await dbDeleteOrder(o)}catch(e){console.warn(e)}toast("주문이 삭제되었습니다.")}
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();$("monthTitle").textContent=`${y}년 ${m+1}월`;const st=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h='<div class="calendar">';["일","월","화","수","목","금","토"].forEach(x=>h+=`<div class="calhead">${x}</div>`);for(let i=0;i<st;i++)h+='<div class="day"></div>';for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,os=orders.filter(o=>o.shipDate===ds);h+=`<div class="day"><b>${d}</b>${os.map(o=>`<div class="event" onclick="detail('${o.no}')"><b>${o.no}</b><br>${Object.entries(o.items||{}).map(([k,v])=>`${k} ${v}`).join("<br>")}</div>`).join("")}</div>`}h+='</div>';$('calendarGrid').innerHTML=h}
function moveMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderKits(){const t={};kits.forEach(k=>t[k]=0);orders.forEach(o=>Object.entries(o.items||{}).forEach(([k,v])=>t[k]=(t[k]||0)+Number(v||0)));$('kitTable').innerHTML='<table><thead><tr><th>키트</th><th>주문량</th><th>현재재고</th><th>필요량</th><th>상태</th></tr></thead><tbody>'+kits.map(k=>{const n=Math.max(0,t[k]-Number(stock[k]||0));return `<tr><td><b>${k}</b></td><td class="num">${t[k]}</td><td class="num">${stock[k]||0}</td><td class="num"><b>${n}</b></td><td>${n?'<span class="badge red">준비 필요</span>':'<span class="badge green">충족</span>'}</td></tr>`}).join('')+'</tbody></table>'}
function renderStock(){$('stockInputs').innerHTML='<table><thead><tr><th>키트</th><th>현재 재고</th></tr></thead><tbody>'+kits.map(k=>`<tr><td>${k}</td><td><input type="number" min="0" inputmode="numeric" data-stock="${k}" value="${stock[k]||0}" style="width:130px;padding:9px;border:1px solid #d5ded8;border-radius:8px;text-align:right"></td></tr>`).join('')+'</tbody></table>'}
async function saveStock(){document.querySelectorAll('[data-stock]').forEach(i=>stock[i.dataset.stock]=Number(i.value)||0);saveLocal();try{await dbSaveStock()}catch(e){console.warn(e)}renderAll();toast('재고가 저장되었습니다.')}
function refresh(){const t=todayStr(),tom=todayStr(new Date(Date.now()+86400000));$('sToday').textContent=orders.filter(o=>o.shipDate===t).length+'건';$('sTomorrow').textContent=orders.filter(o=>o.shipDate===tom).length+'건';const totals={};kits.forEach(k=>totals[k]=0);orders.forEach(o=>Object.entries(o.items||{}).forEach(([k,v])=>totals[k]+=Number(v||0)));const n=kits.filter(k=>totals[k]>Number(stock[k]||0)&&totals[k]>0).length;$('sPrepare').textContent=n+'종';$('sNeed').textContent=n+'종';const up=orders.filter(o=>o.shipDate>=t).sort((a,b)=>a.shipDate.localeCompare(b.shipDate)).slice(0,8);$('upcoming').innerHTML=up.length?'<div style="overflow:auto"><table><thead><tr><th>발송일</th><th>주문번호</th><th>배송지</th><th>내용</th></tr></thead><tbody>'+up.map(o=>`<tr onclick="detail('${o.no}')" style="cursor:pointer"><td>${o.shipDate}</td><td><b>${o.no}</b></td><td>${esc(o.address)}</td><td>${Object.entries(o.items||{}).map(([k,v])=>`${k} ${v}개`).join(' · ')}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">다가오는 발송 주문이 없습니다.</div>';$('todayText').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}
function renderAll(){refresh();renderOrders();renderCalendar();renderKits();renderStock()}
async function tryDbLoad(){try{const d=await dbGet();if(d.orders.length||d.stock.length){orders=d.orders;stock={};kits.forEach(k=>stock[k]=0);d.stock.forEach(x=>stock[x.kit_name]=Number(x.quantity)||0);saveLocal();return true}}catch(e){console.warn('Supabase 연결/권한 없음',e)}return false}
function start(){loadLocal();initKitInputs();renderAll();tryDbLoad().then(()=>renderAll()).catch(()=>renderAll())}
start();
</script></body></html>
